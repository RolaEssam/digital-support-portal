spring:
  application:
    name: digital-support-portal

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

server:
  port: ${SERVER_PORT:8081}

auth:
  public-key:
    rsa-key-size: 2048
    key-ttl: 300s
    request-id-reservation-ttl: 24h

  encryption:
    key: ${DSP_AES_KEY:}
    version: 1

  rate-limit:
    max-requests: 20
    window: 60s

  login:
    max-failed-attempts: 5
    lockout-duration: 15m
    idle-timeout: 30m

  token:
    access-token-ttl: 15m
    refresh-token-ttl: 7d
