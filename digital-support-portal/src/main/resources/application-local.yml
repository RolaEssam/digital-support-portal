
spring:
  application:
    name: digital-support-portal

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 3s
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

server:
  port: 8081
  servlet:
    context-path: /api/authentication

auth:
  public-key:
    rsa-key-size: 2048
    key-ttl: 300s

  rate-limit:
    max-requests: 10
    window: 1s

  login:
    max-failed-attempts: 5
    lockout-duration: 15m
    idle-timeout: 30m

  encryption:
    key: ${DSP_AES_KEY:}
